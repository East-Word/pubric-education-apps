
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2f7f4; --surface: #ffffff; --surface2: #e8f3ed;
    --border: rgba(0,0,0,0.08); --text: #112418; --muted: #5a7563;
    --hint: #a8c4b0; --accent: #1e8a4a;
    --rate-green: #00b894; --rate-amber: #e17055; --rate-red: #d63031;
    --radius: 16px; --radius-sm: 10px;
  }
  [data-theme="dark"] {
    --bg: #0d1710; --surface: #172a1e; --surface2: #1f3828;
    --border: rgba(255,255,255,0.07); --text: #e4f2e9; --muted: #7faa8a;
    --hint: #3a5c45; --accent: #3ecf72;
    --rate-green: #00cec9; --rate-amber: #fdcb6e; --rate-red: #ff7675;
  }
  html, body { width: 100%; }
  .outer {
    width: 100%; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 2rem 1rem; transition: background 0.3s, color 0.3s;
  }
  .app { width: 100%; max-width: 900px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
  .app-name { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
  .toggle-row { display: flex; align-items: center; gap: 8px; }
  .theme-label { font-size: 11px; color: var(--hint); }
  .theme-toggle {
    width: 44px; height: 24px; border-radius: 99px;
    background: var(--surface2); border: 1px solid var(--border);
    cursor: pointer; position: relative; transition: background 0.3s; flex-shrink: 0;
  }
  .theme-toggle::after {
    content: ''; position: absolute; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); top: 2px; left: 3px;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"] .theme-toggle::after { transform: translateX(20px); }
  .header {
    text-align: center; margin-bottom: 2rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 1.75rem 1.5rem; transition: background 0.3s;
  }
  .icon-wrap {
    width: 60px; height: 60px; border-radius: 18px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px; font-size: 26px;
  }
  .title-sub { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 6px; }
  .title-main { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; line-height: 1.2; margin-bottom: 10px; }
  .title-main span {
    display: inline-block; background: var(--accent); color: #fff;
    border-radius: 6px; padding: 1px 8px; font-size: 18px; font-weight: 700;
    vertical-align: middle; margin-right: 4px;
  }
  .title-desc { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .input-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.1rem 1.25rem;
    margin-bottom: 10px; transition: background 0.3s;
  }
  .input-card label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.06em; display: flex; align-items: center;
    gap: 5px; margin-bottom: 10px; justify-content: center;
  }
  .input-card input[type=number] {
    width: 100%; background: var(--surface2); border: 1.5px solid transparent;
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 32px; font-weight: 700; padding: 10px 14px; text-align: center;
    outline: none; font-family: inherit; transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  .input-card input[type=number]::-webkit-inner-spin-button,
  .input-card input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  .input-card input[type=number]::placeholder { color: var(--hint); font-size: 13px; font-weight: 400; }
  .input-card input[type=number]:focus { border-color: var(--accent); }
  .result-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 2.25rem 1.5rem 1.75rem;
    text-align: center; margin-bottom: 10px;
    position: relative; overflow: hidden;
    min-height: 210px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: border-color 0.4s, background 0.3s;
  }
  .rate-display { display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
  .rate-num { font-size: 120px; font-weight: 800; line-height: 1; color: var(--hint); transition: color 0.4s; letter-spacing: -3px; }
  .rate-unit { font-size: 30px; font-weight: 700; margin-bottom: 12px; color: var(--hint); transition: color 0.4s; }
  .rate-msg { font-size: 14px; color: var(--muted); margin-top: 14px; line-height: 1.5; min-height: 21px; }
  .fraction-label { font-size: 12px; color: var(--hint); margin-top: 6px; }
  .bar-track { width: 100%; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 1.25rem; }
  .bar-fill { height: 100%; border-radius: 99px; width: 0%; background: var(--hint); transition: width 0.55s cubic-bezier(.4,0,.2,1), background 0.4s; }
  .confetti-piece { position: absolute; width: 7px; height: 7px; border-radius: 2px; opacity: 0; pointer-events: none; }
</style>

      <p class="title-sub">福知山市立成和中学校</p>
      <h1 class="title-main"><span>夢ノート</span>提出率チェッカー</h1>
      <p class="title-desc">学習委員が毎朝チェック！<br>人数を入力してクラスの提出率を確認しよう。</p>
    </div>

    <div class="input-card">
      <label><i class="ti ti-users"></i>今日の出席人数</label>
      <input type="number" id="total-input" min="1" max="60" placeholder="出席人数を入力してね" inputmode="numeric" />
    </div>

    <div class="input-card">
      <label><i class="ti ti-notebook"></i>夢ノートの提出人数</label>
      <input type="number" id="sub-input" min="0" placeholder="提出した人数を入力してね" inputmode="numeric" />
    </div>

    <div class="result-card" id="result-card">
      <div class="rate-display">
        <span class="rate-num" id="rate-num">？</span>
        <span class="rate-unit" id="rate-unit">%</span>
      </div>
      <p class="rate-msg" id="rate-msg">今日は何%かな？</p>
      <p class="fraction-label" id="fraction-label"></p>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    </div>

    <button
      onclick="reset()"
      style="
        display: flex; align-items: center; justify-content: center; gap: 8px;
        width: 100%; padding: 15px;
        background-color: #1e8a4a !important;
        color: #ffffff !important;
        border: none; border-radius: 10px;
        font-size: 15px; font-weight: 700; font-family: inherit;
        letter-spacing: 0.03em; cursor: pointer;
        transition: opacity 0.2s;
      "
      onmouseover="this.style.opacity='0.85'"
      onmouseout="this.style.opacity='1'"
      onmousedown="this.style.transform='scale(0.98)'"
      onmouseup="this.style.transform='scale(1)'"
    >
      <i class="ti ti-refresh" style="font-size:18px; color:#fff;"></i>
      リセット
    </button>
  </div>
</div>

<script>
  const rootEl  = document.getElementById('root');
  const totalEl = document.getElementById('total-input');
  const subEl   = document.getElementById('sub-input');
  const numEl   = document.getElementById('rate-num');
  const unitEl  = document.getElementById('rate-unit');
  const msgEl   = document.getElementById('rate-msg');
  const fracEl  = document.getElementById('fraction-label');
  const barEl   = document.getElementById('bar');
  const cardEl  = document.getElementById('result-card');

  const msgs = {
    perfect: ['🎉 全員提出！クラス最高！！', '🏆 パーフェクト達成！みんな最高！', '✨ 全員そろった！今日は伝説の日！'],
    high:    ['あと少し！声をかけてみよう 💪', '惜しい！あと一歩で全員提出！', 'もうすぐ100%！みんなで目指そう！'],
    mid:     ['半分以上が提出済み！この調子で！', 'いい感じ！もっと声をかけよう！', 'まだまだいける！一緒に出そう！'],
    low:     ['まだ間に合う！一緒に出そう！', '今からでも大丈夫！声をかけて！', 'ゆっくりでも大丈夫。まず一人から！'],
    zero:    ['さあスタート！最初の一人を待とう', '今日もよろしく！記録を始めよう！']
  };
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  let lastRate = -1, confettiTimer = null;

  function setColor(cssVar) {
    const c = `var(${cssVar})`;
    numEl.style.color = c; unitEl.style.color = c;
    barEl.style.background = c; cardEl.style.borderColor = c;
  }

  function calc() {
    const total = parseInt(totalEl.value);
    const sub   = parseInt(subEl.value);
    if (isNaN(total) || total < 1 || isNaN(sub)) {
      numEl.textContent = '？';
      numEl.style.color = ''; unitEl.style.color = '';
      barEl.style.background = ''; cardEl.style.borderColor = '';
      msgEl.textContent = '今日は何%かな？';
      fracEl.textContent = ''; barEl.style.width = '0%';
      stopConfetti(); lastRate = -1; return;
    }
    const s = Math.min(total, Math.max(0, sub));
    const rate = Math.round(s / total * 100);
    numEl.textContent = rate;
    fracEl.textContent = s + ' 人 / ' + total + ' 人';
    barEl.style.width = rate + '%';

    let colorVar, msg;
    if (rate === 100)    { colorVar = '--rate-green'; msg = pick(msgs.perfect); }
    else if (rate >= 80) { colorVar = '--rate-green'; msg = pick(msgs.high); }
    else if (rate >= 50) { colorVar = '--rate-amber'; msg = pick(msgs.mid); }
    else if (rate > 0)   { colorVar = '--rate-red';   msg = pick(msgs.low); }
    else                 { colorVar = '--rate-red';   msg = pick(msgs.zero); }

    setColor(colorVar);
    msgEl.textContent = msg;
    if (rate === 100 && lastRate !== 100) startConfetti();
    else if (rate !== 100) stopConfetti();
    lastRate = rate;
  }

  function reset() {
    totalEl.value = ''; subEl.value = '';
    numEl.textContent = '？';
    numEl.style.color = ''; unitEl.style.color = '';
    barEl.style.background = ''; cardEl.style.borderColor = '';
    msgEl.textContent = '今日は何%かな？';
    fracEl.textContent = ''; barEl.style.width = '0%';
    stopConfetti(); lastRate = -1;
  }

  function toggleTheme() {
    const isDark = rootEl.getAttribute('data-theme') === 'dark';
    rootEl.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('theme-label').textContent = isDark ? 'ライト' : 'ダーク';
  }

  const cc = ['#1e8a4a','#00b894','#e17055','#3ecf72','#00cec9'];
  function spawnConfetti() {
    for (let i = 0; i < 13; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.background = cc[Math.floor(Math.random() * cc.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.top = '-10px';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
      cardEl.appendChild(el);
      el.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${(Math.random()-.5)*220}px,${130+Math.random()*130}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: 'ease-out', fill: 'forwards' }).onfinish = () => el.remove();
    }
  }
  function startConfetti() { spawnConfetti(); confettiTimer = setInterval(spawnConfetti, 650); }
  function stopConfetti() {
    if (confettiTimer) { clearInterval(confettiTimer); confettiTimer = null; }
    cardEl.querySelectorAll('.confetti-piece').forEach(e => e.remove());
  }

  totalEl.addEventListener('input', calc);
  subEl.addEventListener('input', calc);
</script>
